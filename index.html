    <title>CrimeAlert — Livekarta över polishändelser i Sverige</title>
    <script>
      // If the app's own files can't load (an old copy of the page after a new version was
      // published), drop the offline copy and load the page fresh, past every cache, at most once a
      // minute. If that doesn't help, or the app doesn't start at all, show a message with a reload
      // button instead of an empty page. The same as src/lib/staleBuild.ts, for when the app itself
      // can't start.
      (function () {
        var KEY = 'crimealert_stale_build_reload';
        function loadFresh() {
          var done = false;
          var go = function () {
            if (done) return;
            done = true;
            try {
              var url = new URL(location.href);
              url.searchParams.set('_fresh', String(Date.now()));
              location.replace(url.toString());
            } catch (e) { location.reload(); }
          };
          setTimeout(go, 3000);
          var sw = navigator.serviceWorker;
          Promise.all([
            sw ? sw.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
            window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null
          ]).then(go, go);
        }
        function showMessage() {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0c0f;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;text-align:center">' +
            '<div style="max-width:320px"><p style="margin:0;font-size:20px;font-weight:700;color:#fff">CrimeAlert kunde inte starta</p>' +
            '<p style="margin:10px 0 20px;font-size:15px;line-height:1.5;color:#a3abb5">En ny version har just publicerats eller så bröts anslutningen. Ladda om, så fungerar det igen.</p>' +
            '<button id="ca-load-fresh" type="button" style="height:44px;padding:0 22px;border:0;border-radius:10px;background:#dc2626;color:#fff;font-size:15px;font-weight:600">Ladda om</button></div></div>';
          document.getElementById('ca-load-fresh').onclick = loadFresh;
        }
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
          var url = el.src || el.href;
          if (!url || !/\/assets\//.test(url)) return;
          try {
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 60000) { showMessage(); return; }
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {}
          loadFresh();
        }, true);
        // The app draws something within a moment of loading; still nothing means it couldn't start
        window.addEventListener('load', function () { setTimeout(showMessage, 4000); });
      })();
    </script>
