    <title>CrimeAlert — Livekarta över polishändelser i Sverige</title>
    <script>
      // If the app's own files can't load (an old copy of the page from the offline cache, after
      // a new version was published), drop the offline copy and load the site fresh, at most once
      // a minute. The same as src/lib/staleBuild.ts, for when the app itself can't start.
      window.addEventListener('error', function (event) {
        var el = event.target;
        if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
        var url = el.src || el.href;
        if (!url || !/\/assets\//.test(url)) return;
        var key = 'crimealert_stale_build_reload';
        try {
          if (Date.now() - Number(sessionStorage.getItem(key) || 0) < 60000) return;
          sessionStorage.setItem(key, String(Date.now()));
        } catch (e) {}
        var sw = navigator.serviceWorker;
        var reload = function () { location.reload(); };
        Promise.all([
          sw ? sw.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
          window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null,
        ]).then(reload, reload);
      }, true);
    </script>
